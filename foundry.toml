[profile.default]
src             = 'contracts'
test            = 'tests'
libs            = ['modules']
optimizer       = false
solc_version    = '0.8.34'
verbosity       = 3
block_timestamp = 1_622_400_000
fs_permissions  = [{ access = "read", path = "./"}]

[profile.default.lint]
lint_on_build = false

[profile.default.fuzz]
runs = 1_000

[profile.ci.fuzz]
runs = 100_000

[profile.production]
optimizer      = true
optimizer_runs = 200
