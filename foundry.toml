[profile.default]
src             = 'contracts'
test            = 'tests'
libs            = ['modules']
optimizer       = false
solc_version    = '0.8.34'
verbosity       = 3
block_timestamp = 1_622_400_000
fs_permissions  = [{ access = "read", path = "./"}]

[profile.default.fmt]
line_length                  = 140
tab_width                    = 4
style                        = "space"
bracket_spacing              = true
contract_new_lines           = true
prefer_compact               = "none"
multiline_func_header        = "all"
quote_style                  = "double"
int_types                    = "long"
number_underscore            = "preserve"
hex_underscore               = "remove"
single_line_statement_blocks = "preserve"
sort_imports                 = false
override_spacing             = false
pow_no_space                 = false
wrap_comments                = true
docs_style                   = "block"
ignore                       = []

[profile.default.lint]
lint_on_build = false

[profile.default.fuzz]
runs = 1_000

[profile.ci.fuzz]
runs = 100_000

[profile.production]
optimizer      = true
optimizer_runs = 200
